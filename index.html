<style>
:root{
  --black:#111111;
  --black2:#0D0D0D;
  --white:#FFFFFF;
  --gray:#F5F5F5;
  --gray2:#E7E7E7;
  --muted:#6B6B6B;
  --red:#F4645C;
  --red-dark:#D8483F;
  --red-bg:#FCE4E2;
  --green:#2E9E5B;
  --radius:14px;
  --shadow:0 2px 14px rgba(0,0,0,0.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo',sans-serif;background:var(--white);color:var(--black);direction:rtl;font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{text-decoration:none;color:inherit}
button{font-family:inherit;cursor:pointer;border:none;background:none;font-size:inherit;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px}
.container{max-width:1180px;margin:0 auto;padding:0 20px}
::selection{background:var(--red-bg);color:var(--red-dark)}

/* ===== Buttons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius:10px;font-weight:700;font-size:14.5px;transition:transform .12s ease, opacity .12s ease;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-black{background:var(--black);color:var(--white)}
.btn-black:hover{opacity:.88}
.btn-outline{background:transparent;color:var(--black);border:1.5px solid var(--black)}
.btn-outline:hover{background:var(--black);color:var(--white)}
.btn-accent{background:var(--red);color:var(--white)}
.btn-accent:hover{background:var(--red-dark)}
.btn-ghost{background:var(--gray);color:var(--black)}
.btn-wa{background:#25D366;color:#fff}
.btn-sm{padding:8px 14px;font-size:13px;border-radius:8px}
.btn-block{width:100%}
.btn-danger{background:var(--red-bg);color:var(--red-dark)}
.btn[disabled]{opacity:.4;pointer-events:none}

/* ===== Badges ===== */
.badge{display:inline-block;padding:4px 10px;border-radius:100px;font-size:11.5px;font-weight:700}
.badge-sale{background:var(--red-bg);color:var(--red-dark)}
.badge-new{background:var(--black);color:var(--white)}
.badge-best{background:var(--gray2);color:var(--black)}
.badge-low{background:var(--red-bg);color:var(--red-dark)}

/* ===== Header ===== */
header.site{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--gray2)}
.header-row{display:flex;align-items:center;gap:16px;height:66px}
.logo{font-weight:800;font-size:21px;letter-spacing:-.5px;display:inline-flex;align-items:center;gap:9px}
.logo span{color:var(--red)}
.logo-img{width:34px;height:34px;border-radius:50%;object-fit:cover;flex:0 0 auto;display:block}
.admin-side .logo{margin-bottom:0}
.nav-links{display:flex;gap:22px;font-weight:600;font-size:14.5px;margin-inline-start:8px}
.nav-links a{color:var(--muted)}
.nav-links a.active,.nav-links a:hover{color:var(--black)}
.search-box{flex:1;max-width:380px;position:relative}
.search-box input{width:100%;padding:10px 38px 10px 14px;border-radius:100px;border:1.5px solid var(--gray2);background:var(--gray)}
.search-box input:focus{outline:none;border-color:var(--black)}
.icon-btn{position:relative;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:10px}
.icon-btn:hover{background:var(--gray)}
.cart-count{position:absolute;top:-2px;left:-2px;background:var(--red);color:#fff;font-size:10.5px;font-weight:800;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.header-right{display:flex;align-items:center;gap:6px;margin-inline-start:auto}
.mobile-only{display:none}

/* ===== Why Wassel ===== */
.why-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.why-card{background:var(--gray);border-radius:14px;padding:20px;text-align:center}
.why-ic{font-size:28px;margin-bottom:8px}
.why-card h4{font-size:14.5px;font-weight:800;margin-bottom:6px}
.why-card p{font-size:12.5px;color:var(--muted);line-height:1.6}
@media (max-width:960px){.why-grid{grid-template-columns:repeat(2,1fr)}}

/* ===== Mobile search row (shown under header on small screens) ===== */
.mobile-search-row{display:none;padding:0 0 12px}
.mobile-search-row .search-box{max-width:none}

/* ===== Search suggestions dropdown ===== */
.search-box{position:relative}
.search-suggest{position:absolute;top:calc(100% + 6px);right:0;left:0;background:#fff;border:1px solid var(--gray2);border-radius:12px;box-shadow:0 10px 28px rgba(0,0,0,.12);z-index:150;overflow:hidden;max-height:320px;overflow-y:auto}
.search-suggest a{display:flex;align-items:center;gap:10px;padding:9px 12px;color:var(--black);font-size:13.5px}
.search-suggest a:hover{background:var(--gray)}
.search-suggest img{width:32px;height:32px;border-radius:7px;object-fit:cover;flex:0 0 auto}
.search-suggest .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search-suggest .price{color:var(--muted);font-size:12px;flex:0 0 auto}

/* ===== Bottom mobile navigation ===== */
.bottom-nav{display:none}
@media (max-width:960px){
  .bottom-nav{
    display:flex;position:fixed;bottom:0;right:0;left:0;z-index:80;background:#fff;
    border-top:1px solid var(--gray2);box-shadow:0 -4px 16px rgba(0,0,0,.06);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  }
  .bottom-nav a{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    color:var(--muted);font-size:10.5px;font-weight:700;padding:6px 2px;position:relative;
  }
  .bottom-nav a .ic{font-size:19px}
  .bottom-nav a.active{color:var(--red-dark)}
  .bottom-nav .bn-badge{position:absolute;top:0;left:22%;background:var(--red);color:#fff;font-size:9.5px;font-weight:800;width:15px;height:15px;border-radius:50%;display:flex;align-items:center;justify-content:center}
  body{padding-bottom:58px}
  .wa-float{bottom:70px}
  .mobile-search-row{display:block}
}

/* ===== Floating WhatsApp ===== */
.wa-float{position:fixed;bottom:22px;left:22px;z-index:60;background:#25D366;color:#fff;width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.22);font-size:26px}

/* ===== Demo Banner ===== */

/* ===== Hero ===== */
.hero{background:var(--black2);color:#fff;padding:64px 0 60px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(600px 300px at 85% 20%, rgba(244,100,92,.18), transparent)}
.hero-inner{position:relative;max-width:640px}
.eyebrow{display:inline-block;background:var(--red);color:#fff;font-weight:700;font-size:12px;padding:5px 12px;border-radius:100px;margin-bottom:16px}
.hero h1{font-size:38px;font-weight:800;line-height:1.25;margin-bottom:14px}
.hero p{color:#CFCFCF;font-size:16px;margin-bottom:26px;max-width:480px}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap}

/* ===== Sections ===== */
.section{padding:46px 0}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:22px}
.section-head h2{font-size:22px;font-weight:800}
.section-head a{font-size:13.5px;font-weight:700;color:var(--red)}

/* ===== Categories ===== */
.cat-scroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px}
.cat-chip{flex:0 0 auto;background:var(--gray);border-radius:12px;padding:14px 18px;font-weight:700;font-size:13.5px;border:1.5px solid transparent;transition:.15s}
.cat-chip:hover,.cat-chip.active{background:var(--black);color:#fff}

/* ===== Product Grid ===== */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.card{background:#fff;border:1px solid var(--gray2);border-radius:var(--radius);overflow:hidden;transition:box-shadow .15s, transform .15s;display:flex;flex-direction:column}
.card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.card-img{aspect-ratio:1/1;background:var(--gray);position:relative;overflow:hidden}
.card-img img{width:100%;height:100%;object-fit:cover}
.card-badges{position:absolute;top:9px;right:9px;display:flex;flex-direction:column;gap:5px}
.card-body{padding:13px 14px 15px;display:flex;flex-direction:column;gap:6px;flex:1}
.card-title{font-weight:700;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-cat{color:var(--muted);font-size:12px}
.price-row{display:flex;align-items:center;gap:8px;margin-top:2px}
.price-now{font-weight:800;font-size:16px}
.price-old{color:var(--muted);text-decoration:line-through;font-size:12.5px}
.stock-low{color:var(--red-dark);font-size:11.5px;font-weight:700}
.card-actions{display:flex;gap:7px;margin-top:8px}
.card-actions .btn{flex:1;padding:9px 10px;font-size:13px}

/* ===== Filters bar ===== */
.filters{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.filters select{padding:9px 12px;border-radius:9px;border:1.5px solid var(--gray2);background:#fff}

/* ===== Product Page ===== */
.pd-wrap{display:grid;grid-template-columns:1fr 1fr;gap:44px;padding:36px 0}
.pd-main-img{aspect-ratio:1/1;background:var(--gray);border-radius:var(--radius);overflow:hidden;margin-bottom:12px}
.pd-main-img img{width:100%;height:100%;object-fit:cover}
.pd-thumbs{display:flex;gap:8px;overflow-x:auto}
.pd-thumb{width:66px;height:66px;flex:0 0 auto;border-radius:8px;overflow:hidden;border:2px solid transparent;background:var(--gray);cursor:pointer}
.pd-thumb.active{border-color:var(--red)}
.pd-thumb img{width:100%;height:100%;object-fit:cover}
.pd-cat{color:var(--red);font-weight:700;font-size:12.5px}
.pd-title{font-size:26px;font-weight:800;margin:8px 0 10px}
.pd-price{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.pd-price .price-now{font-size:24px}
.pd-desc{color:var(--muted);margin-bottom:20px;font-size:14.5px}
.pd-qty{display:flex;align-items:center;gap:0;border:1.5px solid var(--gray2);border-radius:10px;width:fit-content;margin-bottom:18px}
.pd-qty button{width:38px;height:40px;font-weight:800;font-size:17px}
.pd-qty span{width:44px;text-align:center;font-weight:700}
.pd-actions{display:flex;gap:10px;margin-bottom:22px;flex-wrap:wrap}
.pd-specs{border-top:1px solid var(--gray2);padding-top:16px;font-size:14px}
.pd-specs div{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--gray2)}
.pd-specs b{color:var(--muted);font-weight:600}

/* ===== Cart ===== */
.cart-item{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--gray2);align-items:center}
.cart-item img{width:72px;height:72px;border-radius:10px;object-fit:cover;background:var(--gray)}
.cart-item-info{flex:1}
.cart-item-info .name{font-weight:700;font-size:14.5px}
.cart-item-info .cat{color:var(--muted);font-size:12px}
.qty-mini{display:flex;align-items:center;border:1.5px solid var(--gray2);border-radius:8px;width:fit-content;margin-top:6px}
.qty-mini button{width:26px;height:26px;font-weight:800}
.qty-mini span{width:30px;text-align:center;font-size:13px;font-weight:700}
.cart-summary{background:var(--gray);border-radius:var(--radius);padding:22px}
.summary-row{display:flex;justify-content:space-between;padding:8px 0;font-size:14.5px}
.summary-row.total{border-top:1.5px solid var(--gray2);margin-top:8px;padding-top:14px;font-weight:800;font-size:17px}
.summary-row .discount{color:var(--red-dark);font-weight:700}
.remove-x{color:var(--red-dark);font-size:12.5px;font-weight:700;margin-top:6px}

/* ===== Checkout ===== */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .full{grid-column:1/-1}
.field label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:11px 13px;border:1.5px solid var(--gray2);border-radius:10px;background:#fff}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--black)}
.checkout-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:36px;align-items:start}

/* ===== Empty state ===== */
.empty{text-align:center;padding:70px 20px}
.empty .ic{font-size:44px;margin-bottom:14px}
.empty h3{font-weight:800;font-size:18px;margin-bottom:6px}
.empty p{color:var(--muted);margin-bottom:20px}

/* ===== Tracking ===== */
.track-box{max-width:460px;margin:0 auto}
.timeline{margin-top:30px}
.tl-step{display:flex;gap:14px;padding-bottom:26px;position:relative}
.tl-step:not(:last-child)::before{content:"";position:absolute;top:26px;right:12px;width:2px;height:100%;background:var(--gray2)}
.tl-step.done:not(:last-child)::before{background:var(--black)}
.tl-dot{width:26px;height:26px;border-radius:50%;background:var(--gray2);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;flex:0 0 auto;font-weight:800;z-index:1}
.tl-step.done .tl-dot{background:var(--black)}
.tl-step.current .tl-dot{background:var(--red)}
.tl-text b{display:block;font-size:14.5px}
.tl-text span{color:var(--muted);font-size:12.5px}

/* ===== Toast ===== */
.toast{position:fixed;bottom:24px;right:24px;background:var(--black);color:#fff;padding:14px 20px;border-radius:10px;font-weight:700;font-size:14px;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;align-items:center;gap:10px;animation:toastIn .25s ease}
.toast.err{background:var(--red-dark)}
@keyframes toastIn{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}

/* ===== Footer ===== */
footer{background:var(--black2);color:#fff;padding:44px 0 24px;margin-top:40px}
.footer-grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:30px;margin-bottom:30px}
footer h4{font-weight:700;margin-bottom:12px;font-size:14px}
footer p,footer a{color:#B5B5B5;font-size:13.5px;line-height:2}
footer a:hover{color:#fff}
.footer-bottom{border-top:1px solid #262626;padding-top:18px;text-align:center;color:#8A8A8A;font-size:12.5px}

/* ===== Admin — قائمة همبرغر واحدة موحّدة لكل أحجام الشاشات ===== */
.admin-topbar-main{background:var(--black2);position:sticky;top:0;z-index:60}
.admin-topbar-main-row{display:flex;align-items:center;justify-content:space-between;padding:14px 18px}
.admin-topbar-main-row .logo{color:#fff;margin:0}
.hamburger-btn{background:none;border:none;color:#fff;font-size:26px;line-height:1;cursor:pointer;padding:4px 6px}
.admin-dropdown{max-height:0;overflow:hidden;transition:max-height .25s ease;display:flex;flex-direction:column;background:#1D1D1D}
.admin-dropdown.open{max-height:420px}
.admin-dropdown a{display:block;padding:15px 18px;color:#B5B5B5;font-weight:700;font-size:14.5px;border-top:1px solid #2b2b2b}
.admin-dropdown a.active,.admin-dropdown a:hover{background:#262626;color:#fff}
.admin-main{padding:22px 18px;background:var(--gray);min-height:100vh}
.admin-topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.admin-topbar h1{font-size:20px;font-weight:800}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.stat-card{background:#fff;border-radius:12px;padding:18px;border:1px solid var(--gray2)}
.stat-card .n{font-size:24px;font-weight:800}
.stat-card .l{color:var(--muted);font-size:12.5px;margin-top:2px}
.stat-card.alert .n{color:var(--red-dark)}
.panel{background:#fff;border-radius:12px;border:1px solid var(--gray2);overflow:hidden}
.panel-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--gray2)}
.panel-head h3{font-size:15.5px;font-weight:800}
table{width:100%;border-collapse:collapse}
th{text-align:right;font-size:12px;color:var(--muted);padding:10px 16px;border-bottom:1px solid var(--gray2);font-weight:700}
td{padding:12px 16px;border-bottom:1px solid var(--gray2);font-size:13.5px;vertical-align:middle}
tr:last-child td{border-bottom:none}
.row-img{width:38px;height:38px;border-radius:8px;object-fit:cover;background:var(--gray)}
.status-pill{padding:4px 10px;border-radius:100px;font-size:11.5px;font-weight:700;display:inline-block}
.st-new{background:var(--gray2);color:var(--black)}
.st-progress{background:#FFF1D6;color:#9A6A00}
.st-delivered{background:#E4F6EB;color:var(--green)}
.st-cancelled{background:var(--red-bg);color:var(--red-dark)}
.icon-action{padding:6px 10px;border-radius:7px;font-size:12.5px;font-weight:700}
.icon-action:hover{background:var(--gray)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
.modal{background:#fff;border-radius:14px;max-width:560px;width:100%;max-height:88vh;overflow-y:auto;padding:24px}
.modal h3{font-size:18px;font-weight:800;margin-bottom:16px}
.chip-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip-list .chip{background:var(--gray);padding:6px 10px;border-radius:8px;font-size:12px;display:flex;align-items:center;gap:6px}
.chip-list .chip button{color:var(--red-dark);font-weight:800}
.img-preview-list{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.img-preview-item{position:relative;width:78px;height:78px;border-radius:10px;overflow:hidden;border:1.5px solid var(--gray2)}
.img-preview-item img{width:100%;height:100%;object-fit:cover;display:block}
.img-preview-item button{position:absolute;top:2px;left:2px;background:rgba(0,0,0,.65);color:#fff;width:20px;height:20px;border-radius:50%;font-size:11px;line-height:1}
.login-box{max-width:360px;margin:80px auto;background:#fff;padding:30px;border-radius:16px;border:1px solid var(--gray2)}

@media (max-width:960px){
  .grid{grid-template-columns:repeat(2,1fr)}
  .pd-wrap{grid-template-columns:1fr;gap:24px}
  .checkout-grid{grid-template-columns:1fr}
  .footer-grid{grid-template-columns:1fr}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .admin-main{padding:16px 12px 40px}
  .admin-topbar h1{font-size:18px}
  .admin-topbar .btn{flex:1 1 auto;text-align:center}

  .nav-links,.mobile-hide{display:none}
  .mobile-only{display:flex}
  .hero h1{font-size:28px}
  .search-box{display:none}
  .pd-main-img{max-height:360px}
  .pd-thumb{width:56px;height:56px}
  .pd-title{font-size:21px}
  .pd-desc{font-size:13.5px;line-height:1.7}
  .pd-price .price-now{font-size:20px}
  .container{padding:0 14px}
  .stat-card .n{font-size:19px}
}

/* ===== Phone-width refinements (admin tables → cards, forms, modals) ===== */
@media (max-width:680px){
  .stat-grid{gap:10px}
  .stat-card{padding:14px}
  .stat-card .n{font-size:17px}
  .stat-card .l{font-size:11.5px}
  .form-grid{grid-template-columns:1fr}
  .login-box{margin:40px auto;max-width:92vw;padding:24px 20px}

  /* Bottom-sheet style modal so it never overflows the screen */
  .modal-bg{align-items:flex-end;padding:0}
  .modal{max-width:100%;max-height:90vh;border-radius:16px 16px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
  .modal h3{font-size:16.5px}

  /* Turn admin tables into stacked cards */
  .admin-main table thead{display:none}
  .admin-main table,.admin-main table tbody,.admin-main table tr,.admin-main table td{display:block;width:100%}
  .admin-main table{border-collapse:separate}
  .admin-main table tr{background:#fff;border:1px solid var(--gray2);border-radius:12px;padding:4px 12px;margin:10px}
  .admin-main table td{
    border:none;border-bottom:1px dashed var(--gray2);padding:9px 0;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    font-size:13px;text-align:left;
  }
  .admin-main table td:last-child{border-bottom:none}
  .admin-main table td::before{
    content:attr(data-label);color:var(--muted);font-weight:700;font-size:11.5px;flex:0 0 auto;text-align:right;
  }
  .admin-main table td select{max-width:62%}
  .admin-main .row-img{width:42px;height:42px}
  .admin-topbar{margin-bottom:16px}
  .admin-topbar h1{font-size:17px}
}
</style>

let DB = { products: [], categories: [], orders: [], zones: [] };
let cart = [];
let route = "#/";
let productDraftImages = [];

/* ---------- بيانات أولية (تُستخدم فقط أول مرة قبل إنشاء أي بيانات محلية) ---------- */
const SEED_CATEGORIES = [
  { id: 'cat_electronics', name: 'إلكترونيات' },
  { id: 'cat_accessories', name: 'إكسسوارات' },
  { id: 'cat_home', name: 'أدوات منزلية' },
  { id: 'cat_personal', name: 'مستلزمات شخصية' },
  { id: 'cat_kids', name: 'منتجات أطفال' },
];
const SEED_ZONES = [
  { id: 'zone_gaza', name: 'غزة', fee: 15, eta: '1-2 يوم' },
  { id: 'zone_north', name: 'شمال غزة', fee: 20, eta: '2-3 أيام' },
  { id: 'zone_mid', name: 'الوسطى', fee: 18, eta: '1-2 يوم' },
  { id: 'zone_khan', name: 'خانيونس', fee: 22, eta: '2-3 أيام' },
  { id: 'zone_rafah', name: 'رفح', fee: 25, eta: '2-3 أيام' },
];
const SEED_PRODUCTS = [];

/* ---------- طبقة التخزين المحلي (بديل كامل عن أي سيرفر أو API خارجي) ---------- */
const LS_KEY = 'wassel_local_db';
function loadDB() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch (e) { saved = null; }
  if (saved && saved.products && saved.categories && saved.zones) {
    DB.products = saved.products; DB.categories = saved.categories;
    DB.zones = saved.zones; DB.orders = saved.orders || [];
  } else {
    DB.products = SEED_PRODUCTS; DB.categories = SEED_CATEGORIES;
    DB.zones = SEED_ZONES; DB.orders = [];
    persistDB();
  }
}
function persistDB() {
  localStorage.setItem(LS_KEY, JSON.stringify({
    products: DB.products, categories: DB.categories, zones: DB.zones, orders: DB.orders,
  }));
}
function deriveCustomers() {
  const map = {};
  for (const o of DB.orders) {
    if (o.status === 'ملغى') continue;
    if (!map[o.phone]) map[o.phone] = { name: o.customerName, phone: o.phone, whatsapp: o.whatsapp, ordersCount: 0, totalSpent: 0 };
    map[o.phone].ordersCount++; map[o.phone].totalSpent += o.total;
  }
  return Object.values(map);
}

/* ---------- تحميل البيانات العامة (محليًا بالكامل — بدون أي اتصال خارجي) ---------- */
async function loadAll() {
  loadDB();
  try { cart = JSON.parse(localStorage.getItem('wassel_cart') || '[]'); } catch (e) { cart = []; }
  adminAuthed = localStorage.getItem('wassel_admin_authed') === '1';
}
function saveCart() { localStorage.setItem('wassel_cart', JSON.stringify(cart)); }

/* ---------- Utils ---------- */
function toEnglishDigits(str) {
  if (str === null || str === undefined) return str;
  return String(str)
    .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d))
    .replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
}
function money(n) { return Number(n).toLocaleString('en-US') + " " + CURRENCY; }
const PLACEHOLDER_IMG = "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(
  `<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400"><rect width="100%" height="100%" fill="#f0f0f0"/><text x="50%" y="50%" font-family="Arial" font-size="20" fill="#999" text-anchor="middle" dy=".3em">لا توجد صورة</text></svg>`
);
function productImg(p, idx) { return (p.images && p.images[idx || 0]) || PLACEHOLDER_IMG; }
function findProduct(id) { return DB.products.find(p => p.id === id); }
function catName(p) { return p.category?.name || p.categoryName || ''; }
function cartCount() { return cart.reduce((s, i) => s + i.qty, 0); }
function cartTotal() { return cart.reduce((s, i) => { const p = findProduct(i.id); if (!p) return s; const price = p.salePrice || p.price; return s + price * i.qty; }, 0); }
function toast(msg, err) {
  const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2800);
}
function go(h) { location.hash = h; }
function waLink(phoneOrGeneric, text) {
  return "https://wa.me/" + (phoneOrGeneric || "970500000000") + "?text=" + encodeURIComponent(text);
}
function uid(pre) { return pre + Math.random().toString(36).slice(2, 8); }

/* ---------- Layout pieces ---------- */
function badgesHtml(p) {
  let out = "";
  if (p.salePrice) out += `<span class="badge badge-sale">خصم ${Math.round(100 - (p.salePrice / p.price * 100))}%</span>`;
  if (p.badges && p.badges.includes('new')) out += `<span class="badge badge-new">جديد</span>`;
  if (p.badges && p.badges.includes('best')) out += `<span class="badge badge-best">الأكثر مبيعًا</span>`;
  if (p.stock <= (p.lowStockAt ?? 5)) out += `<span class="badge badge-low">كمية محدودة</span>`;
  return out;
}
function productCard(p) {
  const price = p.salePrice || p.price;
  return `
  <div class="card">
    <a href="#/product/${p.id}">
      <div class="card-img">
        <img src="${productImg(p)}" alt="${p.name}">
        <div class="card-badges">${badgesHtml(p)}</div>
      </div>
    </a>
    <div class="card-body">
      <a href="#/product/${p.id}"><div class="card-title">${p.name}</div></a>
      <div class="card-cat">${catName(p)}</div>
      <div class="price-row">
        <span class="price-now">${money(price)}</span>
        ${p.salePrice ? `<span class="price-old">${money(p.price)}</span>` : ""}
      </div>
      <div class="card-actions">
        <button class="btn btn-black" onclick="quickAdd('${p.id}')">أضف للسلة</button>
        <button class="btn btn-accent" onclick="buyNow('${p.id}')">اشترِ الآن</button>
      </div>
    </div>
  </div>`;
}
function header() {
  return `
  <header class="site">
    <div class="container header-row">
      <a href="#/" class="logo"><img src="${LOGO_SRC}" class="logo-img" alt="شعار واصل">واصل <span>| Wassel</span></a>
      <div class="nav-links mobile-hide">
        <a href="#/" class="${route === '#/' ? 'active' : ''}">الرئيسية</a>
        <a href="#/shop" class="${route.startsWith('#/shop') ? 'active' : ''}">المتجر</a>
        <a href="#/track">تتبع الطلب</a>
      </div>
      <div class="search-box">
        <input id="searchInput" placeholder="ابحث عن منتج..." autocomplete="off" oninput="showSearchSuggest(this.value,'searchSuggest')" onkeydown="if(event.key==='Enter'){go('#/shop?q='+encodeURIComponent(this.value));hideSearchSuggest('searchSuggest')}" onblur="setTimeout(()=>hideSearchSuggest('searchSuggest'),150)">
        <div id="searchSuggest"></div>
      </div>
      <div class="header-right">
        <a class="icon-btn" href="${waLink('', 'مرحبًا، أريد الاستفسار عن منتجاتكم في واصل.')}" target="_blank" title="واتساب">💬</a>
        <a class="icon-btn" href="#/cart" title="السلة">
          🛒<span class="cart-count">${cartCount()}</span>
        </a>
        <a class="icon-btn" href="#/admin" title="لوحة التحكم">⚙️</a>
      </div>
    </div>
    <div class="container mobile-search-row">
      <div class="search-box">
        <input id="searchInputMobile" placeholder="ابحث عن منتج..." autocomplete="off" oninput="showSearchSuggest(this.value,'searchSuggestMobile')" onkeydown="if(event.key==='Enter'){go('#/shop?q='+encodeURIComponent(this.value));hideSearchSuggest('searchSuggestMobile')}" onblur="setTimeout(()=>hideSearchSuggest('searchSuggestMobile'),150)">
        <div id="searchSuggestMobile"></div>
      </div>
    </div>
  </header>`;
}
function showSearchSuggest(q, containerId) {
  const box = document.getElementById(containerId);
  if (!box) return;
  q = q.trim().toLowerCase();
  if (q.length < 2) { box.innerHTML = ''; return; }
  const results = DB.products.filter(p => p.name.toLowerCase().includes(q)).slice(0, 6);
  if (!results.length) { box.innerHTML = `<div class="search-suggest"><a>لا نتائج مطابقة لـ "${q}"</a></div>`; return; }

function pageShop(params) {

  if (sort === 'price_desc') list.sort((a, b) => (b.salePrice || b.price) - (a.salePrice || a.price));

function removeFromCart(id) {

function updateDeliveryFee() {
  const sel = document.getElementById('zoneSelect');
  const z = DB.zones.find(z => z.id === sel.value);
  const subtotal = cartTotal();
  if (z) {
    document.getElementById('feeDisplay').textContent = money(z.fee);
    document.getElementById('totalDisplay').textContent = money(subtotal + z.fee);
  }
}
function isValidPsPhone(phone) {
  const digits = phone.replace(/[^0-9]/g, '');
  return /^05\d{8}$/.test(digits);
}
function genOrderNumber() {
  return 'ORD-' + Math.floor(1000 + Math.random() * 9000) + '-' + Date.now().toString().slice(-4);
}
function submitOrder(e) {
  e.preventDefault();
  const f = new FormData(e.target);
  const zoneId = f.get('zone');
  const zone = DB.zones.find(z => z.id === zoneId);
  if (!zone) { toast('يرجى اختيار منطقة التوصيل.', true); return; }

  const phone = toEnglishDigits(f.get('phone').trim());
  if (!isValidPsPhone(phone)) {
    toast('يرجى إدخال رقم هاتف فلسطيني صحيح (يبدأ بـ 05 ويتكون من 10 أرقام، مثال: 0591234567).', true);
    document.getElementById('phoneInput').focus();
    return;
  }

  const neighborhood = f.get('neighborhood').trim();
  const landmark = f.get('landmark').trim();
  const details = (f.get('details') || '').trim();
  const address = [`المنطقة: ${zone.name}`, `الحي: ${neighborhood}`, `أقرب نقطة دالة: ${landmark}`, details ? `تفاصيل إضافية: ${details}` : ''].filter(Boolean).join(' — ');

  const items = [];
  for (const i of cart) {
    const p = findProduct(i.id);
    if (!p) { toast(`أحد المنتجات لم يعد متوفرًا. يرجى تعديل السلة.`, true); return; }
    if (p.stock < i.qty) { toast(`الكمية المتوفرة من "${p.name}" أصبحت ${p.stock} فقط. يرجى تعديل السلة.`, true); return; }
    items.push({ productId: p.id, name: p.name, price: p.salePrice || p.price, qty: i.qty });
  }

  const subtotal = items.reduce((s, i) => s + i.price * i.qty, 0);
  const total = subtotal + zone.fee;
  const whatsapp = f.get('wa') || phone;

  const order = {
    id: uid('order_'), orderNumber: genOrderNumber(),
    customerName: f.get('name'), phone, whatsapp,
    address, notes: f.get('notes') || '', payment: f.get('payment'), zoneId, zone,
    subtotal, deliveryFee: zone.fee, total,
    status: 'جديد', items, statusHistory: [{ status: 'جديد', at: new Date().toISOString() }],
    createdAt: new Date().toISOString(),
  };

  // تخفيض المخزون محليًا
  for (const item of items) {
    const p = findProduct(item.productId);
    if (p) p.stock = Math.max(0, p.stock - item.qty);
  }
  DB.orders.unshift(order);
  persistDB();

  cart = []; saveCart();
  const msg = `مرحبًا ${order.customerName} 👋\n\nتم استلام طلبك بنجاح من Wassel | واصل.\n\nرقم الطلب: #${order.orderNumber}\nإجمالي المنتجات: ${money(order.subtotal)}\nرسوم التوصيل: ${money(order.deliveryFee)}\nالإجمالي النهائي: ${money(order.total)}\n\nسنقوم بالتواصل معك لتأكيد الطلب.\nشكرًا لاختيارك واصل.`;
  document.getElementById('app').innerHTML = `
  ${header()}
  <div class="container section">
    <div class="empty" style="max-width:520px;margin:0 auto">
      <div class="ic">✅</div>
      <h3>تم إرسال طلبك بنجاح</h3>
      <p>رقم طلبك هو <b>#${order.orderNumber}</b>. احتفظ به لمتابعة حالة الطلب.</p>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px">
        <a class="btn btn-wa" href="${waLink(order.whatsapp, msg)}" target="_blank">إرسال تأكيد عبر واتساب</a>
        <a class="btn btn-black" href="#/track">تتبع الطلب</a>
        <a class="btn btn-outline" href="#/shop">متابعة التسوق</a>
      </div>
    </div>
  </div>
  ${footer()}`;
}

function doTrack() {
  const id = toEnglishDigits(document.getElementById('trackId').value.trim());
  const phone = toEnglishDigits(document.getElementById('trackPhone').value.trim());
  const box = document.getElementById('trackResult');
  const order = DB.orders.find(o => o.orderNumber === id && o.phone === phone);
  if (!order) {
    box.innerHTML = `<div class="empty"><div class="ic">❓</div><h3>لم يتم العثور على الطلب</h3><p>تأكد من رقم الطلب ورقم الهاتف.</p></div>`;
    return;
  }
  const curIdx = order.status === 'ملغى' ? -1 : STATUS_STEPS.indexOf(order.status);
  box.innerHTML = `
  <div class="timeline">
    ${order.status === 'ملغى' ? `<div class="tl-step current"><div class="tl-dot">✕</div><div class="tl-text"><b>تم إلغاء الطلب</b><span>يرجى التواصل معنا عبر واتساب لمزيد من التفاصيل</span></div></div>` :
    STATUS_STEPS.map((s, i) => `
      <div class="tl-step ${i < curIdx ? 'done' : ''} ${i === curIdx ? 'current' : ''}">
        <div class="tl-dot">${i < curIdx ? '✓' : i + 1}</div>
        <div class="tl-text"><b>${s}</b>${i === curIdx ? `<span>الحالة الحالية</span>` : ''}</div>
      </div>`).join('')}
  </div>
  <div class="cart-summary" style="margin-top:10px">
    <div class="summary-row"><span>الإجمالي</span><span>${money(order.total)}</span></div>
    <div class="summary-row"><span>المنطقة</span><span>${order.zone?.name || ''}</span></div>
  </div>`;
}

function renderImgChips() {
  if (productDraftImages.length === 0) return `<span style="color:var(--muted);font-size:12px">لا توجد صور بعد — اختر ملفًا من جهازك</span>`;
  return productDraftImages.map((img, i) => `
    <div class="img-preview-item">
      <img src="${img}">
      <button type="button" onclick="removeDraftImage(${i})">✕</button>
    </div>`).join('');
}
function removeDraftImage(i) { productDraftImages.splice(i, 1); document.getElementById('imgChips').innerHTML = renderImgChips(); }
/* قراءة الصور محليًا من جهاز المستخدم مباشرة (بدون أي رفع لسيرفر) وتحويلها لمعاينة فورية */
function handleImageSelect(input) {
  const files = Array.from(input.files || []);
  if (!files.length) return;
  let remaining = files.length;
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = () => {
      productDraftImages.push(reader.result);
      document.getElementById('imgChips').innerHTML = renderImgChips();
      remaining--;
      if (remaining === 0) toast('تمت إضافة الصور بنجاح.');
    };
    reader.onerror = () => { remaining--; toast('تعذّرت قراءة إحدى الصور.', true); };
    reader.readAsDataURL(file);
  });
  input.value = '';
}
function saveProduct(id) {
  const name = document.getElementById('f_name').value.trim();
  const price = parseFloat(document.getElementById('f_price').value) || 0;
  const catNameInput = document.getElementById('f_cat').value.trim();
  if (!name || price <= 0) { toast('يرجى إدخال اسم المنتج والسعر بشكل صحيح.', true); return; }
  if (!catNameInput) { toast('يرجى كتابة اسم التصنيف.', true); return; }

  // ابحث عن تصنيف بنفس الاسم (بدون حساسية لحالة الأحرف)، وإن لم يوجد أنشئه محليًا
  let category = DB.categories.find(c => c.name.trim().toLowerCase() === catNameInput.toLowerCase());
  let categoryId;
  if (category) {
    categoryId = category.id;
  } else {
    const newCat = { id: uid('cat_'), name: catNameInput };
    DB.categories.push(newCat);
    categoryId = newCat.id;
  }

  const sale = parseFloat(document.getElementById('f_sale').value) || null;
  const badges = []; if (document.getElementById('f_new').checked) badges.push('new'); if (document.getElementById('f_best').checked) badges.push('best');
  const images = productDraftImages.length ? productDraftImages : [];
  const catObj = DB.categories.find(c => c.id === categoryId);

  if (id) {
    const p = DB.products.find(p => p.id === id);
    if (p) {
      Object.assign(p, {
        name, sku: document.getElementById('f_sku').value || p.sku,
        categoryId, category: catObj, price,
        salePrice: sale && sale < price ? sale : null,
        stock: parseInt(document.getElementById('f_stock').value) || 0,
        description: document.getElementById('f_desc').value, images, badges,
      });
    }
  } else {
    DB.products.push({
      id: uid('prod_'),
      name, sku: document.getElementById('f_sku').value || ('WSL-' + uid('')),
      categoryId, category: catObj, price,
      salePrice: sale && sale < price ? sale : null,
      stock: parseInt(document.getElementById('f_stock').value) || 0,
      description: document.getElementById('f_desc').value, images, badges,
    });
  }
  persistDB();
  closeModal(); render(); toast('تم حفظ المنتج بنجاح.');
}

  DB.products = DB.products.filter(p => p.id !== id);

  const customers = deriveCustomers();
  return `
  <div class="admin-topbar"><h1>العملاء</h1></div>
  <div class="panel">
    <table>
      <thead><tr><th>الاسم</th><th>الهاتف</th><th>عدد الطلبات</th><th>إجمالي الإنفاق</th><th>واتساب</th></tr></thead>
      <tbody>
        ${customers.map(c => `
          <tr>
            <td data-label="الاسم">${c.name}</td>
            <td data-label="الهاتف">${c.phone}</td>
            <td data-label="عدد الطلبات">${c.ordersCount}</td>
            <td data-label="إجمالي الإنفاق">${money(c.totalSpent)}</td>
            <td data-label="واتساب"><a class="icon-action" href="${waLink(c.whatsapp, 'مرحبًا ' + c.name + '، معك فريق واصل.')}" target="_blank">مراسلة</a></td>
          </tr>`).join('') || `<tr><td colspan="5" style="text-align:center;color:var(--muted)">لا يوجد عملاء بعد</td></tr>`}
      </tbody>
    </table>
  </div>`;
}

/* ---------- Router ---------- */
function parseHash() {
  const h = location.hash || '#/';
  const [path, qs] = h.split('?');
  const params = new URLSearchParams(qs || '');
  return { path, params };
}
function render() {
  route = location.hash || '#/';
  const { path, params } = parseHash();
  const app = document.getElementById('app');
  let html = '';
  if (path === '#/') html = pageHome();
  else if (path === '#/shop') html = pageShop(params);
  else if (path.startsWith('#/product/')) html = pageProduct(path.split('/')[2]);
  else if (path === '#/cart') html = pageCart();
  else if (path === '#/checkout') html = pageCheckout();
  else if (path === '#/track') html = pageTrack();
  else if (path.startsWith('#/admin')) html = pageAdmin(path.split('/')[2]);
  else html = pageHome();
  if (html !== '') app.innerHTML = `<a class="wa-float" href="${waLink('', 'مرحبًا واصل، أريد الاستفسار.')}" target="_blank">💬</a>` + html + (path.startsWith('#/admin') ? '' : bottomNav());
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', render);
loadAll().then(render);
</script>
</body>
</html>
